[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "distillo"
version = "0.2.0"
description = "Distill lectures, courses and podcasts into the few key points worth learning, each linked to the exact moment it was said."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Acanfora", email = "andreaacanfora95@gmail.com" }]
requires-python = ">=3.10"
keywords = ["lecture", "summarization", "whisper", "llm", "claude", "study", "notes", "transcription"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=2.6",
    # Compresses long recordings for upload. Below 19: faster-whisper 1.2.1 passes an
    # argument that PyAV 19 removed.
    "av>=11,<19",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "typer>=0.12",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
# Local speech-to-text for audio and video files (runs fully offline).
local = ["faster-whisper>=1.1"]

[project.urls]
Homepage = "https://github.com/AndreaAcanfora/distillo"
Issues = "https://github.com/AndreaAcanfora/distillo/issues"
Funding = "https://www.paypal.com/paypalme/AndreaAca"

[project.scripts]
distillo = "distillo.cli:app"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
